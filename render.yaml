# NEXORION Stage 5 staging deployment.
# Set DATABASE_URL to the Neon PostgreSQL connection string in Render's environment UI.
services:
  - type: web
    name: nexorion-stage5-staging
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: NEXORION_WORKER_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: NEXORION_BOOTSTRAP_OWNER_EMAIL
        sync: false
      - key: NEXORION_BOOTSTRAP_OWNER_PASSWORD
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: ALLOW_SELF_REGISTRATION
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: PYTHON_VERSION
        value: 3.12.11
