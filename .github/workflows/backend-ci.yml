name: Backend CI

on:
  push:
    branches: [main, stage2, stage3-digital-world, stage4-implementation, stage5-implementation]
    paths:
      - "backend/**"
      - "docs/stage2/**"
      - "docs/stage3/**"
      - "docs/stage4/**"
      - "docs/stage5/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docs/stage2/**"
      - "docs/stage3/**"
      - "docs/stage4/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Upgrade fresh SQLite database
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/nexorion-migration.db
          APP_ENV: test
        run: alembic upgrade head
      - name: Verify SQLite downgrade and re-upgrade
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/nexorion-migration.db
          APP_ENV: test
        run: |
          alembic downgrade 0001_initial
          alembic upgrade head
          alembic current
      - name: Run API tests
        run: pytest
      - name: Run static checks
        run: ruff check app tests alembic

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexorion
          POSTGRES_PASSWORD: nexorion-test-password
          POSTGRES_DB: nexorion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexorion -d nexorion_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Upgrade fresh PostgreSQL database
        env:
          DATABASE_URL: postgresql+psycopg://nexorion:nexorion-test-password@localhost:5432/nexorion_test
          APP_ENV: test
        run: alembic upgrade head
      - name: Create isolated PostgreSQL API test database
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://nexorion:nexorion-test-password@localhost:5432/postgres", autocommit=True) as connection:
              connection.execute("CREATE DATABASE nexorion_api_test")
          PY
      - name: Run full backend suite against PostgreSQL 16
        env:
          NEXORION_API_TEST_DATABASE_URL: postgresql+psycopg://nexorion:nexorion-test-password@localhost:5432/nexorion_api_test
          NEXORION_TEST_DATABASE_URL: postgresql+psycopg://nexorion:nexorion-test-password@localhost:5432/nexorion_test
        run: pytest -q
      - name: Verify PostgreSQL downgrade and re-upgrade
        env:
          DATABASE_URL: postgresql+psycopg://nexorion:nexorion-test-password@localhost:5432/nexorion_test
          APP_ENV: test
        run: |
          alembic downgrade 0001_initial
          alembic upgrade head
          alembic current
