name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - "docs/stage4/**"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build production assets
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:////tmp/nexorion-stage4-e2e.db
      NEXORION_API_ORIGIN: http://127.0.0.1:8000
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test dependencies
        run: python -m pip install -e ".[test]"
        working-directory: backend
      - name: Apply migrations to disposable E2E database
        run: alembic upgrade head
        working-directory: backend
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Run authenticated end-to-end browser tests
        run: npm run test:e2e